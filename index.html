<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="提词器">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>随身提词器</title>
<style>
/* 布局：稿件页是浅色卡片式工作台（跟随系统深浅色）；拍摄页是相机取景界面，毛玻璃控件压在画面上，提词区贴顶靠近前置镜头 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef2; --ink:#15171c; --mute:#737985; --line:#e2e4e9;
  --rec:#ee3440; --rec-soft:#fde8e9; --shadow:0 1px 2px rgba(20,24,32,.05),0 8px 24px rgba(20,24,32,.06);
  --em:#ffd25a;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --glass:rgba(22,22,26,.42); --glass-line:rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e0f12; --surface:#17191d; --sunk:#1f2126; --ink:#f1f2f4; --mute:#8b909a; --line:#272a30;
  --rec:#ff4852; --rec-soft:#3a1b1e; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e0f12; --surface:#17191d; --sunk:#1f2126; --ink:#f1f2f4; --mute:#8b909a; --line:#272a30;
  --rec:#ff4852; --rec-soft:#3a1b1e; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
[hidden]{display:none!important}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ================= 稿件页 ================= */
.page{padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
.bar h1{font-size:22px;font-weight:700;letter-spacing:.01em;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.bar h1 i{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 4px var(--rec-soft)}
.bar .sub{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.icon-btn:active{transform:scale(.95)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rec);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}

.scripts{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1*max(16px,env(safe-area-inset-left))) 12px;padding:2px max(16px,env(safe-area-inset-left)) 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.scripts::-webkit-scrollbar{display:none}
.card{flex:none;width:132px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;border:1.5px solid transparent}
.card b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.card.on{border-color:var(--ink)}

.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 10px}
#title{width:100%;font:700 19px/1.3 var(--sans);color:var(--ink);background:transparent;border:0;outline:none;padding:2px 0 10px}
#title::placeholder,#text::placeholder{color:var(--mute);opacity:.7}
#text{flex:1;min-height:0;width:100%;resize:none;font:17px/1.8 var(--sans);color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0 0;outline:none}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
#stat{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:0}
.tbtns{display:flex;gap:4px;flex:none}
.tbtn{font-size:13px;padding:7px 10px;border-radius:9px;color:var(--ink);background:var(--sunk)}
.tbtn.danger{color:var(--rec);background:transparent}

.cta{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:12px 0 14px}
.btn{height:54px;border-radius:16px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);box-shadow:var(--shadow)}
.btn.go{background:var(--ink);color:var(--bg)}
.btn.go i{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(238,52,64,.25)}

/* ================= 片库 ================= */
.takes{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.take{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.thumb{width:60px;height:80px;border-radius:10px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.take .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.take .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .m{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1.5}
.take .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--rec-soft);color:var(--rec);margin-left:4px;vertical-align:1px}
.take .del{font-size:13px;padding:8px 10px;border-radius:9px;color:var(--mute)}
.take .del.armed{color:#fff;background:var(--rec)}
.empty{margin:auto 0;text-align:center;color:var(--mute);font-size:14px;line-height:1.8;padding:40px 20px}
.empty svg{width:40px;height:40px;stroke-width:1.4;margin-bottom:8px;opacity:.6}

/* ================= 拍摄页（固定深色） ================= */
#shoot{background:#000;color:#fff;font-family:var(--sans)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
.nocam{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);padding:16px 18px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-line);color:rgba(255,255,255,.85);font-size:14px;line-height:1.6;text-align:center}
#prompter{position:absolute;left:0;right:0;top:0;overflow:hidden;touch-action:none;
  background:linear-gradient(rgba(6,6,8,var(--shade,.55)),rgba(6,6,8,var(--shade,.55)) 78%,rgba(6,6,8,0));
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);
  padding-top:env(safe-area-inset-top)}
#roll{padding:0 max(22px,env(safe-area-inset-right)) 0 max(26px,env(safe-area-inset-left));will-change:transform;white-space:pre-wrap;word-break:break-all;font-weight:600;line-height:1.55;letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#roll span.done{color:rgba(255,255,255,.34)}
#roll span.em{color:var(--em)}
#roll span.em.done{color:rgba(255,210,90,.38)}
.readline{position:absolute;left:max(10px,env(safe-area-inset-left));width:4px;border-radius:2px;background:var(--rec);box-shadow:0 0 10px rgba(238,52,64,.7);pointer-events:none}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line)}
.status{position:absolute;top:calc(var(--area,42%) + 6px);left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.status .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;font-size:12px;color:rgba(255,255,255,.9);white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
.pill i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);flex:none;transition:background .15s,box-shadow .15s}
.mic.voice i{background:#38d877;box-shadow:0 0 0 3px rgba(56,216,119,.25)}
#heard{overflow:hidden;text-overflow:ellipsis}
.hud{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;background:var(--rec);border-color:transparent}
.hud i{background:#fff;animation:blink 1s infinite}
.res{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.7)}
@keyframes blink{50%{opacity:.25}}

#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#count span{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font:700 64px/1 var(--sans);font-variant-numeric:tabular-nums;color:#fff}

.dock{position:absolute;left:0;right:0;bottom:0;padding:44px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 45%)}
.dock-top{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:14px}
.seg{display:inline-flex;padding:3px;border-radius:12px;gap:2px}
.seg span{font-size:13px;padding:6px 16px;border-radius:9px;color:rgba(255,255,255,.75);transition:background .2s,color .2s}
.seg span.on{background:#fff;color:#111;font-weight:600}
.dock-top .gear{position:absolute;right:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.controls{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.88)}
.ctl .disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.ctl:active .disc{transform:scale(.92)}
.ctl:disabled{opacity:.35}
#backBtn{grid-column:1} #homeBtn{grid-column:2} #recBtn{grid-column:3} #playBtn{grid-column:4} #flipBtn{grid-column:5}
.recbtn{width:76px;height:76px;border-radius:50%;border:4px solid rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.recbtn i{width:60px;height:60px;border-radius:50%;background:var(--rec);transition:all .22s cubic-bezier(.3,.7,.4,1)}
.recbtn.on i{width:28px;height:28px;border-radius:7px}
.recbtn:disabled{opacity:.6}

/* 设置面板 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.settings{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:rgba(28,28,32,.72);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border-top:1px solid var(--glass-line);color:#fff}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 12px}
.settings h3{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.settings h3 button{font-size:14px;color:rgba(255,255,255,.7);font-weight:400}
.group{border-radius:16px;background:rgba(255,255,255,.07);padding:4px 14px;margin-bottom:12px}
.slider{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;gap:10px;height:46px;font-size:14px}
.slider + .slider{border-top:1px solid rgba(255,255,255,.07)}
.slider output{text-align:right;font-size:13px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.slider input{width:100%;accent-color:#fff}
.slider input:disabled{opacity:.35}
.sw{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:54px;text-align:left}
.sw + .sw{border-top:1px solid rgba(255,255,255,.07)}
.sw b{display:block;font-size:15px;font-weight:500}
.sw small{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.sw i{flex:none;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on i{background:#34c759}
.sw.on i::after{transform:translateX(18px)}

/* ================= 回看 ================= */
#review{position:fixed;inset:0;background:#0b0b0d;color:#fff;display:flex;flex-direction:column;gap:14px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:5}
#review video{flex:1;min-height:0;width:100%;background:#000;border-radius:18px;object-fit:contain}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{border-radius:14px;background:rgba(255,255,255,.07);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.metric small{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.04em}
.metric b{font:600 20px/1.2 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.metric b em{font-style:normal;font-size:12px;font-weight:500;margin-left:4px;padding:1px 6px;border-radius:5px;vertical-align:3px}
.metric em.ok{background:rgba(52,199,89,.2);color:#5fe08a} .metric em.warn{background:rgba(255,204,0,.18);color:#ffd65c}
.racts{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.racts .btn{height:52px}
.rbtn{background:rgba(255,255,255,.1);color:#fff}
.rbtn.main{background:#fff;color:#111}
.rfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.5);gap:10px}
.rfoot button{color:rgba(255,255,255,.8);font-size:13px;text-decoration:underline;text-underline-offset:3px;flex:none}

.toast{position:fixed;left:50%;top:calc(46% + env(safe-area-inset-top));transform:translateX(-50%);max-width:80vw;background:rgba(30,30,34,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;line-height:1.5;text-align:center;z-index:9;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- 稿件页 -->
<section id="edit" class="screen page">
  <header class="bar">
    <h1><i></i>提词器</h1>
    <button class="icon-btn" id="libBtn" aria-label="片库"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.5 9.6v4.8l4-2.4z" fill="currentColor" stroke="none"/></svg><span class="badge" id="libCount" hidden></span></button>
    <button class="icon-btn" id="importBtn" aria-label="导入 txt 稿子"><svg viewBox="0 0 24 24"><path d="M12 4v10.5M7.5 10l4.5 4.5 4.5-4.5M5 19.5h14"/></svg></button>
    <button class="icon-btn" id="newBtn" aria-label="新建稿子"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
    <input type="file" id="importFile" accept=".txt,.md,text/plain" multiple hidden>
  </header>
  <nav class="scripts" id="list" aria-label="稿子列表"></nav>
  <main class="sheet">
    <input id="title" placeholder="稿子标题" maxlength="40">
    <textarea id="text" placeholder="把口播稿粘贴到这里…"></textarea>
    <div class="sheet-foot">
      <span id="stat">0 字</span>
      <div class="tbtns">
        <button class="tbtn" id="hintBtn">【】标重点</button>
        <button class="tbtn danger" id="delBtn">删除</button>
      </div>
    </div>
  </main>
  <footer class="cta">
    <button class="btn ghost" id="readBtn">只看稿</button>
    <button class="btn go" id="goBtn"><i></i>开拍</button>
  </footer>
</section>

<!-- 片库 -->
<section id="lib" class="screen page" hidden>
  <header class="bar">
    <button class="icon-btn" id="libBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <h1>片库</h1>
    <span class="sub" id="libSize"></span>
  </header>
  <div class="takes" id="takes"></div>
</section>

<!-- 拍摄页 -->
<section id="shoot" class="screen" hidden>
  <video id="cam" playsinline autoplay muted></video>
  <div class="nocam" id="nocam" hidden></div>
  <div id="prompter"><div class="readline" id="readline"></div><div id="roll"></div></div>

  <div class="status">
    <div class="pill glass mic" id="mic" hidden><i></i><span id="heard">正在听…</span></div>
    <div class="r">
      <div class="pill glass hud" id="hud" hidden><i></i><span id="clock">00:00</span></div>
      <div class="pill glass res" id="res" hidden></div>
    </div>
  </div>
  <div id="count" hidden><span class="glass" id="countNum">3</span></div>

  <div class="dock" id="panel">
    <div class="dock-top">
      <button class="seg glass" id="modeBtn" aria-label="切换滚动方式"></button>
      <button class="gear glass" id="setBtn" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2.2"/><circle cx="9" cy="16.5" r="2.2"/></svg></button>
    </div>
    <div class="controls">
      <button class="ctl" id="backBtn"><span class="disc glass"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></span>返回</button>
      <button class="ctl" id="homeBtn"><span class="disc glass"><svg viewBox="0 0 24 24"><path d="M6.5 5.5v13"/><path d="M18 6.5l-8 5.5 8 5.5z" fill="currentColor"/></svg></span>开头</button>
      <button class="recbtn" id="recBtn" aria-label="录制"><i></i></button>
      <button class="ctl" id="playBtn"></button>
      <button class="ctl" id="flipBtn"><span class="disc glass"><svg viewBox="0 0 24 24"><path d="M5 9.5A7.5 7.5 0 0 1 18.3 7.3L20 9"/><path d="M19 14.5A7.5 7.5 0 0 1 5.7 16.7L4 15"/><path d="M20 4.5V9h-4.5M4 19.5V15h4.5"/></svg></span>翻转</button>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="settings" id="settings" hidden>
    <div class="grab"></div>
    <h3>提词设置<button id="setDone">完成</button></h3>
    <div class="group">
      <label class="slider"><span>语速</span><input type="range" id="speed" min="80" max="480" step="10"><output id="speedV"></output></label>
      <label class="slider"><span>字号</span><input type="range" id="size" min="20" max="64" step="2"><output id="sizeV"></output></label>
      <label class="slider"><span>提词区</span><input type="range" id="area" min="25" max="70" step="5"><output id="areaV"></output></label>
      <label class="slider"><span>底色</span><input type="range" id="shade" min="0" max="90" step="5"><output id="shadeV"></output></label>
    </div>
    <div class="group">
      <button class="sw" id="tSR"><span><b>识别文字校准</b><small>听得出念到哪个字时，按字精确对齐</small></span><i></i></button>
      <button class="sw" id="tAuto"><span><b>开录即滚动</b><small>按下录制后自动开始</small></span><i></i></button>
      <button class="sw" id="tCount"><span><b>3 秒倒计时</b><small>录制前留出准备时间</small></span><i></i></button>
      <button class="sw" id="tBreak"><span><b>一句一行</b><small>遇到句号、问号自动换行</small></span><i></i></button>
    </div>
    <div class="group">
      <button class="sw" id="tMatch"><span><b>成片和预览一致</b><small>自拍录出来不会左右反</small></span><i></i></button>
      <button class="sw" id="tHQ"><span><b>4K 画质</b><small>更清晰，也更费电和空间</small></span><i></i></button>
      <button class="sw" id="tMirror"><span><b>文字镜像</b><small>配合提词器反光玻璃使用</small></span><i></i></button>
    </div>
  </div>
</section>

<!-- 回看 -->
<section id="review" hidden>
  <video id="playback" playsinline controls></video>
  <div class="metrics" id="stats"></div>
  <div class="racts">
    <button class="btn rbtn" id="retakeBtn">重拍这段</button>
    <button class="btn rbtn main" id="saveBtn">存到相册</button>
  </div>
  <div class="rfoot"><span id="reviewTip"></span><button id="dlBtn">下载文件</button></div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tp:'+k); return v==null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('tp:'+k, JSON.stringify(v)) }catch(e){} }
};
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,1800) }

/* ---------- 稿件 ---------- */
const SAMPLE = {id:'s'+Date.now(), title:'示例：开场白', text:
`大家好，这是一段示例稿子，你可以直接删掉换成自己的口播稿。

拍摄时，文字会从屏幕上方往上滚，尽量把眼睛停在【左边红线】那一行，这样看起来就像在看镜头。

语速单位是「字每分钟」，正常口播大概在两百到两百六之间。点一下文字可以暂停，手指上下拖能往回找。

好，开始录吧。`};
let scripts = store.get('scripts', null) || [SAMPLE];
let cur = store.get('cur', scripts[0].id);
if(!scripts.find(s=>s.id===cur)) cur = scripts[0].id;
const curScript = () => scripts.find(s=>s.id===cur);
function save(){ store.set('scripts', scripts); store.set('cur', cur) }

function renderList(){
  const box=$('list'); box.innerHTML='';
  scripts.forEach(s=>{
    const b=document.createElement('button'); b.className='card'+(s.id===cur?' on':'');
    const t=document.createElement('b'); t.textContent=s.title||'未命名';
    const m=document.createElement('span'); const n=countChars(s.text); m.textContent=`${n} 字 · ${fmtDur(n/settings.speed*60)}`;
    b.append(t,m);
    b.onclick=()=>{ cur=s.id; save(); loadEditor() };
    box.appendChild(b);
  });
}
const fmtDur=s=>{ s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') };
function countChars(t){ return (t.match(/[\p{L}\p{N}]/gu)||[]).length }
function updateStat(){
  const n=countChars($('text').value), cpm=settings.speed;
  const sec=Math.round(n/cpm*60);
  $('stat').textContent=`${n} 字 · 约 ${Math.floor(sec/60)} 分 ${sec%60} 秒`;
}
function loadEditor(){ const s=curScript(); $('title').value=s.title; $('text').value=s.text; renderList(); updateStat() }
$('title').oninput=e=>{ curScript().title=e.target.value; save(); renderList() };
$('text').oninput=e=>{ curScript().text=e.target.value; save(); updateStat(); clearTimeout(renderList.t); renderList.t=setTimeout(renderList,400) };
$('newBtn').onclick=()=>{ const s={id:'s'+Date.now(),title:'新稿 '+(scripts.length+1),text:''}; scripts.unshift(s); cur=s.id; save(); loadEditor(); $('text').focus() };
$('delBtn').onclick=()=>{
  if($('delBtn').dataset.arm!=='1'){ $('delBtn').dataset.arm='1'; $('delBtn').textContent='确认删除'; setTimeout(()=>{ $('delBtn').dataset.arm=''; $('delBtn').textContent='删除' },2500); return }
  scripts=scripts.filter(s=>s.id!==cur); if(!scripts.length) scripts=[{id:'s'+Date.now(),title:'新稿',text:''}];
  cur=scripts[0].id; save(); loadEditor(); $('delBtn').dataset.arm=''; $('delBtn').textContent='删除';
};

/* ---------- 设置 ---------- */
const DEF={speed:220,size:34,area:42,shade:55,mirror:false,countdown:true,auto:true,follow:true,sr:true,match:true,hq:false,brk:false,facing:'user',v:2};
let saved=store.get('settings',{});
if(saved.v!==2) saved={...saved,follow:true,sr:true,match:true,v:2};   // 旧版本设置迁移：默认开跟读、成片同预览
const settings=Object.assign({},DEF,saved);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function applySettings(){
  store.set('settings', settings);
  $('speed').value=settings.speed; $('speedV').textContent=settings.speed+' 字/分';
  $('size').value=settings.size; $('sizeV').textContent=settings.size+' px';
  $('area').value=settings.area; $('areaV').textContent=settings.area+'%';
  $('shade').value=settings.shade; $('shadeV').textContent=settings.shade+'%';
  $('tMirror').classList.toggle('on',settings.mirror);
  $('tCount').classList.toggle('on',settings.countdown);
  $('tAuto').classList.toggle('on',settings.auto);
  $('tSR').classList.toggle('on',settings.sr); $('tSR').hidden=!settings.follow||!SR;
  $('tMatch').classList.toggle('on',settings.match);
  $('tHQ').classList.toggle('on',settings.hq);
  $('tBreak').classList.toggle('on',settings.brk);
  $('modeBtn').innerHTML=`<span class="${settings.follow?'on':''}">跟读</span><span class="${settings.follow?'':'on'}">匀速</span>`;
  const p=$('prompter');
  p.style.height=settings.area+'%';
  $('shoot').style.setProperty('--area', settings.area+'%');
  p.style.setProperty('--shade', settings.shade/100);
  $('roll').style.fontSize=settings.size+'px';
  updatePlayLabel();
  layoutRoll();
  updateStat();
  renderList();
}
['speed','size','area','shade'].forEach(k=>$(k).oninput=e=>{ settings[k]=+e.target.value; applySettings() });
$('tMirror').onclick=()=>{ settings.mirror=!settings.mirror; applySettings() };
$('tCount').onclick=()=>{ settings.countdown=!settings.countdown; applySettings() };
$('tAuto').onclick=()=>{ settings.auto=!settings.auto; applySettings() };
$('tMatch').onclick=()=>{ settings.match=!settings.match; applySettings(); toast(settings.match?'成片会和预览一样（自拍不反）':'成片保存摄像头原始画面') };
$('tHQ').onclick=async()=>{ if(recorder) return; settings.hq=!settings.hq; applySettings(); if(camOn) await startCam() };
$('tSR').onclick=()=>{ settings.sr=!settings.sr; applySettings(); if(listening){ settings.sr?startSR():stopSR() } toast(settings.sr?'会识别你念的字来校准位置':'只按有没有声音来滚动') };
$('modeBtn').onclick=()=>{
  settings.follow=!settings.follow; applySettings();
  if(settings.follow){ ensureListening() } else { stopListen() }
  toast(settings.follow?'跟读：你开口就滚，停下就停':'匀速：按设定语速一直滚');
};
$('tBreak').onclick=()=>{
  settings.brk=!settings.brk; applySettings();
  if(!$('shoot').hidden){ const keep=idxAtReadline(); renderRoll(curScript().text); layoutRoll(); const sp=spans[Math.min(keep,spans.length-1)]; if(sp) setPos(sp.offsetTop-readY) }
};
$('homeBtn').onclick=()=>{ if(recorder) return toast('录制中不能跳回开头'); setPlaying(false); resetFollow() };
function showSheet(v){ $('settings').hidden=!v; $('scrim').hidden=!v }
$('setBtn').onclick=()=>showSheet($('settings').hidden);
$('scrim').onclick=$('setDone').onclick=()=>showSheet(false);

/* ---------- 滚动引擎 ---------- */
let pos=0, playing=false, last=0, readY=0, maxPos=0, pxPerChar=1;
function layoutRoll(){
  const p=$('prompter'), r=$('roll');
  const h=p.clientHeight; if(!h) return;
  const safeTop=parseFloat(getComputedStyle(p).paddingTop)||0;
  readY = safeTop + settings.size*1.2;            // 阅读线：提词区顶部第一行，最贴近前置镜头
  const rl=$('readline'); rl.style.top=(readY+settings.size*0.15)+'px'; rl.style.height=(settings.size*1.25)+'px';
  r.style.paddingTop=(readY-safeTop)+'px';
  r.style.paddingBottom=h+'px';
  const textH=r.scrollHeight - h - (readY-safeTop);
  maxPos=Math.max(0,textH);
  pxPerChar = textH / Math.max(1,countChars(curScript().text));
  setPos(pos);
}
function setPos(v){
  pos=Math.max(0,Math.min(maxPos,v));
  $('roll').style.transform=`translateY(${-pos}px)`+(settings.mirror?' scaleX(-1)':'');
}
let srTarget=-1, srAt=0, markT=0;
function tick(t){
  const dt=Math.min(0.1,(t-last)/1000);
  if(playing && !dragging){
    const v=settings.speed/60*pxPerChar;          // 正常语速对应的像素速度
    if(!settings.follow){
      setPos(pos+v*dt);
      if(pos>=maxPos) setPlaying(false);
    }else{
      const fresh=t-srAt<2500 && srTarget>=0;
      if(voiceOn()) setPos(pos+v*dt*(fresh?0.6:1));     // 有声音就往前走
      if(fresh) setPos(pos+(srTarget-pos)*Math.min(1,dt*4)); // 识别到具体字时往那儿校准
      if(t-markT>250){ markT=t; syncMarks(fresh) }
    }
  }
  drawLevel();
  last=t; requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
const IC_PLAY='<svg viewBox="0 0 24 24"><path d="M8.5 6v12l10-6z" fill="currentColor"/></svg>';
const IC_PAUSE='<svg viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M9 6.5v11M15 6.5v11"/></svg>';
function updatePlayLabel(){ $('playBtn').innerHTML=`<span class="disc glass">${playing?IC_PAUSE:IC_PLAY}</span>${playing?'暂停':(settings.follow?'跟读':'滚动')}` }
function setPlaying(v){ playing=v; updatePlayLabel() }
$('playBtn').onclick=()=>{ if(settings.follow) ensureListening(); setPlaying(!playing) };

/* ---------- 稿子拆成逐字 span，便于定位和标灰 ---------- */
let chars=[], spans=[], cursor=-1, marked=-1, dragging=false;
const isWord=c=>/[\p{L}\p{N}]/u.test(c);
const NORM={'〇':'零','两':'二','幺':'一','地':'的','得':'的','她':'他','它':'他','哪':'那'};
const norm=c=>{ c=c.toLowerCase(); return NORM[c]||c };
function renderRoll(text){
  const r=$('roll'), frag=document.createDocumentFragment();
  chars=[]; spans=[]; cursor=-1; marked=-1; srTarget=-1;
  if(settings.brk) text=text.replace(/([。！？!?；;…]+[”’」』）)]?)(?!\n)/g,'$1\n');
  let buf='', em=false;
  for(const c of text){
    if(c==='【'){ em=true; continue }
    if(c==='】'){ em=false; continue }
    if(isWord(c)){
      if(buf){ frag.appendChild(document.createTextNode(buf)); buf='' }
      const s=document.createElement('span'); s.textContent=c; if(em) s.className='em'; frag.appendChild(s);
      spans.push(s); chars.push(norm(c));
    }else buf+=c;
  }
  if(buf) frag.appendChild(document.createTextNode(buf));
  r.textContent=''; r.appendChild(frag);
}
function markTo(i){
  i=Math.min(i,spans.length-1);
  if(i>marked) for(let k=marked+1;k<=i;k++) spans[k].classList.add('done');
  else for(let k=i+1;k<=marked;k++) spans[k].classList.remove('done');
  marked=i;
}
function idxAtReadline(){
  // 阅读线那一行第一个字的序号（二分）
  const y=pos+readY-2; let lo=0, hi=spans.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(spans[m].offsetTop<y) lo=m+1; else hi=m }
  return lo;
}
function syncMarks(fresh){
  if(fresh) return;                     // 识别结果新鲜时以识别为准
  cursor=idxAtReadline()-1; markTo(cursor);
}
function resetFollow(){ cursor=-1; markTo(-1); srTarget=-1; setPos(0) }
function locate(heard){
  const h=[...heard].filter(isWord).map(norm);
  if(h.length<3) return -1;
  const tail=h.slice(-12), L=tail.length;
  const bi=new Set(); for(let k=0;k<L-1;k++) bi.add(tail[k]+tail[k+1]);
  const need=Math.max(2,Math.ceil(bi.size*0.5));
  const from=Math.max(L-1,cursor-20), to=Math.min(chars.length-1,cursor+Math.max(160,L*6));
  let best=-1, bestScore=0, bestDist=1e9;
  for(let j=from;j<=to;j++){
    const st=Math.max(0,j-L-2); const seg=new Set();
    for(let k=st;k<j;k++) seg.add(chars[k]+chars[k+1]);
    let sc=0; bi.forEach(b=>{ if(seg.has(b)) sc++ });
    if(chars[j]===tail[L-1]) sc+=0.6;
    const dist=Math.abs(j-cursor);
    if(sc>bestScore+0.01 || (Math.abs(sc-bestScore)<=0.01 && dist<bestDist)){ best=j; bestScore=sc; bestDist=dist }
  }
  return bestScore>=need ? best : -1;
}
function onHeard(text){
  setMic(text.slice(-14));
  const j=locate(text);
  if(j<0 || j<cursor-20) return;
  cursor=j; markTo(j);
  const s=spans[Math.min(j+1,spans.length-1)];
  srTarget=Math.max(0,Math.min(maxPos,s.offsetTop-readY)); srAt=performance.now();
}

/* ---------- 跟读：声音检测（一定可用）+ 文字识别（能用就用） ---------- */
let listening=false, actx=null, analyser=null, micSrc=null, ownMic=null, level=0, floor=0.01, voiceUntil=0, lvBuf=null;
function setMic(t){ $('heard').textContent=t }
function voiceOn(){ return performance.now()<voiceUntil }
// 必须在点按里同步调用：iPhone 只允许用户点击时启动音频和识别
function ensureListening(){
  if(listening) return;
  listening=true; $('mic').hidden=false; setMic('准备麦克风…');
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume() }catch(e){}
  if(settings.sr && SR) startSR();
  hookMic();
}
async function hookMic(){
  try{
    let ms=stream && stream.getAudioTracks().length ? new MediaStream(stream.getAudioTracks()) : null;
    if(!ms){ ownMic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); ms=ownMic }
    if(!listening) return;
    micSrc?.disconnect();
    micSrc=actx.createMediaStreamSource(ms);
    analyser=actx.createAnalyser(); analyser.fftSize=1024; lvBuf=new Float32Array(analyser.fftSize);
    micSrc.connect(analyser);
    if(!(settings.sr&&SR)) setMic('声控：开口就滚');
  }catch(e){ setMic('麦克风用不了：'+(e.name||e.message)) }
}
function drawLevel(){
  if(!analyser||!listening) return;
  analyser.getFloatTimeDomainData(lvBuf);
  let sum=0; for(let i=0;i<lvBuf.length;i++) sum+=lvBuf[i]*lvBuf[i];
  level=Math.sqrt(sum/lvBuf.length);
  floor = level<floor ? floor*0.9+level*0.1 : floor*0.998+level*0.002;   // 底噪：降得快升得慢
  if(level>Math.max(floor*2.5,0.012)) voiceUntil=performance.now()+450;
  $('mic').classList.toggle('voice',voiceOn());
}
function stopListen(){
  listening=false; $('mic').hidden=true; stopSR();
  try{ micSrc?.disconnect() }catch(e){} micSrc=null; analyser=null;
  if(ownMic){ ownMic.getTracks().forEach(t=>t.stop()); ownMic=null }
}
let rec=null, srFails=0;
function startSR(){
  stopSR(); srFails=0; runRec();
}
function runRec(){
  if(!listening||!settings.sr||!SR) return;
  const r=new SR(); rec=r;
  r.lang='zh-CN'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onstart=()=>setMic('正在听，开口就滚');
  r.onresult=e=>{ srFails=0; let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; onHeard(txt) };
  r.onerror=e=>{
    const why={'not-allowed':'识别权限被拒','service-not-allowed':'需要在系统设置里打开「听写」','network':'识别要联网，连不上服务','audio-capture':'麦克风被录像占用','no-speech':''}[e.error];
    if(why) setMic('文字识别不可用（'+why+'），改用声控');
    if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='network'||e.error==='audio-capture') srFails=99;
  };
  r.onend=()=>{ if(rec===r && listening && settings.sr && ++srFails<6) setTimeout(()=>{ if(rec===r) runRec() },250) };
  try{ r.start() }catch(e){ setMic('文字识别没启动，改用声控') }
}
function stopSR(){ const r=rec; rec=null; if(r){ try{ r.onend=null; r.abort() }catch(e){} } }

// 点按暂停/继续，拖动手动调位置
(()=>{
  const p=$('prompter'); let sy=0, sp=0, moved=false, was=false;
  p.addEventListener('pointerdown',e=>{ sy=e.clientY; sp=pos; moved=false; was=playing; dragging=true; p.setPointerCapture(e.pointerId) });
  p.addEventListener('pointermove',e=>{ if(!p.hasPointerCapture(e.pointerId)) return; const d=e.clientY-sy; if(Math.abs(d)>6) moved=true; if(moved) setPos(sp-d) });
  p.addEventListener('pointerup',()=>{
    dragging=false;
    if(moved){ srTarget=-1; cursor=idxAtReadline()-1; markTo(cursor); setPlaying(was) }
    else { if(settings.follow) ensureListening(); setPlaying(!was) }
  });
})();

/* ---------- 相机 ---------- */
let stream=null, camOn=false;
async function startCam(){
  stopCam();
  $('nocam').hidden=true;
  if(!navigator.mediaDevices?.getUserMedia){ return camFail('这个浏览器打不开相机。请用 Safari（iPhone）或 Chrome（安卓）通过 https 链接打开。') }
  const W=settings.hq?3840:1920, H=settings.hq?2160:1080;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:settings.facing,width:{ideal:W},height:{ideal:H},frameRate:{ideal:30}},
      audio:{echoCancellation:true,noiseSuppression:true}
    });
    const v=$('cam'); v.srcObject=stream; v.classList.toggle('mirror',settings.facing==='user');
    await v.play().catch(()=>{});
    camOn=true; $('recBtn').hidden=false; $('flipBtn').hidden=false;
    const show=()=>{ if(v.videoWidth){ $('res').hidden=false; $('res').textContent=`${Math.min(v.videoWidth,v.videoHeight)}p · ${v.videoWidth}×${v.videoHeight}` } };
    v.onresize=show; v.onloadedmetadata=show; show();
    if(listening) hookMic();
  }catch(e){ camFail('没有拿到相机/麦克风权限：'+(e.name||e.message)+'。到系统设置里允许浏览器使用相机和麦克风后再试。') }
}
function camFail(msg){ camOn=false; const n=$('nocam'); n.textContent=msg; n.hidden=!msg; $('recBtn').hidden=true; $('flipBtn').hidden=true; $('res').hidden=true }
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null } $('cam').srcObject=null; camOn=false; $('res').hidden=true }
$('flipBtn').onclick=async()=>{ if(recorder) return toast('录制中不能翻转'); settings.facing=settings.facing==='user'?'environment':'user'; applySettings(); await startCam() };

/* ---------- 录制 ---------- */
let recorder=null, chunks=[], recStart=0, clockT=0, lastBlob=null, lastExt='mp4', recPipe=null;
function pickMime(){
  const c=['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  if(!window.MediaRecorder) return null;
  return c.find(m=>MediaRecorder.isTypeSupported?.(m)) || '';
}
// 自拍时把画面左右翻过来再录，让成片和预览一模一样
function recordStream(){
  const v=$('cam');
  if(!(settings.facing==='user' && settings.match)) return {s:stream, stop(){}};
  const c=document.createElement('canvas');
  if(!c.captureStream||!v.videoWidth){ toast('这台手机不支持翻转录制，已按原始画面录'); return {s:stream, stop(){}} }
  c.width=v.videoWidth; c.height=v.videoHeight;
  const g=c.getContext('2d',{alpha:false}); let on=true;
  const draw=()=>{
    if(!on) return;
    g.setTransform(-1,0,0,1,c.width,0); g.drawImage(v,0,0,c.width,c.height);
    v.requestVideoFrameCallback ? v.requestVideoFrameCallback(draw) : requestAnimationFrame(draw);
  };
  draw();
  const cs=c.captureStream(30);
  return {s:new MediaStream([...cs.getVideoTracks(),...stream.getAudioTracks()]), stop(){ on=false; cs.getTracks().forEach(t=>t.stop()) }};
}
function snapThumb(){
  try{
    const v=$('cam'); if(!v.videoWidth) return '';
    const c=document.createElement('canvas'); c.width=150; c.height=Math.round(150*v.videoHeight/v.videoWidth);
    const g=c.getContext('2d');
    if(settings.facing==='user' && settings.match) g.setTransform(-1,0,0,1,c.width,0);
    g.drawImage(v,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.7);
  }catch(e){ return '' }
}
async function countdown(){
  if(!settings.countdown) return;
  const c=$('count'); c.hidden=false;
  for(const n of [3,2,1]){ $('countNum').textContent=n; await new Promise(r=>setTimeout(r,800)) }
  c.hidden=true;
}
$('recBtn').onclick=async()=>{
  if(recorder){ recorder.stop(); return }
  if(!stream) return;
  const mime=pickMime(); if(mime===null) return toast('这个浏览器不支持录像');
  if(settings.follow && settings.auto) ensureListening();     // 趁这次点按把麦克风和识别启动
  $('recBtn').disabled=true; showSheet(false);
  setPlaying(false); srTarget=-1; cursor=idxAtReadline()-1; markTo(cursor); recFrom={pos, idx:cursor+1};
  await countdown();
  chunks=[];
  recPipe=recordStream();
  const bps=settings.hq?30e6:14e6;
  try{ recorder=new MediaRecorder(recPipe.s, mime?{mimeType:mime,videoBitsPerSecond:bps,audioBitsPerSecond:128000}:{videoBitsPerSecond:bps}) }
  catch(e){ recorder=new MediaRecorder(recPipe.s) }
  lastExt=(recorder.mimeType||mime).includes('webm')?'webm':'mp4';
  recorder.ondataavailable=e=>{ if(e.data.size){ chunks.push(e.data); persistChunk(e.data) } };
  recorder.onstop=()=>{
    lastBlob=new Blob(chunks,{type:recorder.mimeType||('video/'+lastExt)});
    const dur=(Date.now()-recStart)/1000;
    const endIdx=settings.follow?Math.max(cursor,idxAtReadline()-1):idxAtReadline()-1;
    const read=Math.max(0,endIdx+1-recFrom.idx);
    finishTake(lastBlob,{dur, chars:read, cpm: dur>5&&read>10 ? Math.round(read/dur*60) : 0, thumb:snapThumb()});
    recPipe?.stop(); recPipe=null;
    recorder=null; $('recBtn').classList.remove('on'); $('hud').hidden=true; clearInterval(clockT);
    setPlaying(false); $('backBtn').disabled=false; openReview({...take, blob:lastBlob},'shoot');
  };
  beginTake();
  recorder.start(1000);
  recStart=Date.now(); $('recBtn').classList.add('on'); $('recBtn').disabled=false; $('backBtn').disabled=true;
  $('hud').hidden=false; $('clock').textContent='00:00';
  clockT=setInterval(()=>{ const s=Math.floor((Date.now()-recStart)/1000); $('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') },250);
  if(settings.auto) setPlaying(true);
};

function fileName(){ const t=reviewTake||{}, d=new Date(t.at||Date.now()), p=n=>String(n).padStart(2,'0'); return `提词_${(t.title||'视频').slice(0,12)}_${d.getMonth()+1}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.${lastExt}` }
const fmtDate=ms=>{ const d=new Date(ms), p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}` };
let reviewTake=null, reviewFrom='shoot', recFrom={pos:0,idx:0};
function openReview(t,from){
  reviewTake=t; reviewFrom=from; lastBlob=t.blob; lastExt=t.ext||lastExt;
  const v=$('playback'); if(v.src) URL.revokeObjectURL(v.src);
  v.src=URL.createObjectURL(lastBlob); $('review').hidden=false;
  $('retakeBtn').textContent=from==='lib'?'返回片库':'重拍这段';
  const tag=!t.cpm?'':t.cpm>280?'<em class="warn">偏快</em>':t.cpm<180?'<em class="warn">偏慢</em>':'<em class="ok">刚好</em>';
  $('stats').innerHTML=`<div class="metric"><small>时长</small><b>${fmtDur(t.dur||0)}</b></div>`
    +`<div class="metric"><small>念了</small><b>${t.cpm?t.chars:'—'}<em style="padding:0;margin-left:2px">${t.cpm?'字':''}</em></b></div>`
    +`<div class="metric"><small>语速 字/分</small><b>${t.cpm||'—'}${tag}</b></div>`;
  const mb=(lastBlob.size/1048576).toFixed(1);
  $('reviewTip').textContent=`${mb} MB · 已存进片库 · 存相册时选「存储视频」`;
}
$('retakeBtn').onclick=()=>{
  $('playback').pause(); $('review').hidden=true;
  if(reviewFrom==='shoot'){ srTarget=-1; setPos(recFrom.pos); cursor=recFrom.idx-1; markTo(cursor) }
  else renderLib();
};
$('saveBtn').onclick=async()=>{
  const f=new File([lastBlob],fileName(),{type:lastBlob.type});
  if(navigator.canShare?.({files:[f]})){
    try{ await navigator.share({files:[f]}); toast('已交给系统处理') }catch(e){ if(e.name!=='AbortError') toast('分享失败，试试「下载文件」') }
  }else toast('这个浏览器不支持直接存相册，请用「下载文件」');
};
$('dlBtn').onclick=()=>{
  const a=document.createElement('a'); a.href=URL.createObjectURL(lastBlob); a.download=fileName();
  document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- 屏幕常亮 ---------- */
let wake=null;
async function keepAwake(){ try{ wake=await navigator.wakeLock?.request('screen') }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && !$('shoot').hidden) keepAwake() });

/* ---------- 切屏 ---------- */
async function enterShoot(withCam){
  if(!countChars(curScript().text)) return toast('先写点稿子');
  renderRoll(curScript().text);
  $('edit').hidden=true; $('shoot').hidden=false; showSheet(false);
  pos=0; setPlaying(false); applySettings(); keepAwake();
  if(withCam) await startCam(); else { stopCam(); camFail(''); $('nocam').hidden=true }
  requestAnimationFrame(layoutRoll);
}
$('goBtn').onclick=()=>enterShoot(true);
$('readBtn').onclick=()=>enterShoot(false);
$('backBtn').onclick=()=>{ if(recorder) return; setPlaying(false); stopListen(); stopCam(); try{wake?.release()}catch(e){}; $('shoot').hidden=true; $('edit').hidden=false };
addEventListener('resize',()=>requestAnimationFrame(layoutRoll));

/* ---------- 片库：录的每一秒都写进手机本地数据库，意外退出也能找回 ---------- */
const DB=(()=>{
  let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('teleprompter',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('takes',{keyPath:'id'}); d.createObjectStore('chunks',{keyPath:['take','seq']}) };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=(st,mode,fn)=>open().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(st,mode), q=fn(t.objectStore(st));
    t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  }));
  const range=id=>IDBKeyRange.bound([id,0],[id,Number.MAX_SAFE_INTEGER]);
  return {
    put:(st,v)=>tx(st,'readwrite',s=>s.put(v)),
    all:st=>tx(st,'readonly',s=>s.getAll()),
    del:(st,k)=>tx(st,'readwrite',s=>s.delete(k)),
    chunksOf:id=>tx('chunks','readonly',s=>s.getAll(range(id))),
    delChunks:id=>tx('chunks','readwrite',s=>s.delete(range(id))),
  };
})();
let take=null, seq=0;
function beginTake(){
  take={id:'t'+Date.now(), title:curScript().title||'未命名', at:Date.now(), type:recorder.mimeType||'', ext:lastExt, done:false};
  seq=0; const t=take;
  DB.put('takes',{...t}).catch(()=>{ t.nopersist=true });
}
function persistChunk(d){ const t=take; if(t && !t.nopersist) DB.put('chunks',{take:t.id,seq:seq++,data:d}).catch(()=>{}) }
async function finishTake(blob,meta){
  const t=take; Object.assign(t,meta,{done:true,size:blob.size});
  const row={...t,blob}; delete row.nopersist;
  try{ await DB.put('takes',row); await DB.delChunks(t.id) }
  catch(e){ toast('没能存进片库，记得点「存到相册」') }
  refreshLibCount();
}
async function recover(){
  try{
    let n=0;
    for(const t of await DB.all('takes')){
      if(t.done) continue;
      const cs=await DB.chunksOf(t.id);
      if(!cs.length){ await DB.del('takes',t.id); continue }
      cs.sort((a,b)=>a.seq-b.seq);
      const blob=new Blob(cs.map(c=>c.data),{type:t.type||('video/'+t.ext)});
      await DB.put('takes',{...t,done:true,recovered:true,blob,size:blob.size,dur:cs.length});
      await DB.delChunks(t.id); n++;
    }
    if(n) toast(`找回了 ${n} 条意外中断的录制，在片库里`);
  }catch(e){}
  refreshLibCount();
}
async function refreshLibCount(){
  let n=0; try{ n=(await DB.all('takes')).filter(t=>t.done).length }catch(e){}
  const b=$('libCount'); b.hidden=!n; b.textContent=n;
}
function mkBtn(label,fn,cls){ const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.onclick=fn; return b }
async function renderLib(){
  let all=[]; try{ all=(await DB.all('takes')).filter(t=>t.done).sort((a,b)=>b.at-a.at) }catch(e){}
  const box=$('takes'); box.textContent='';
  if(!all.length){
    box.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.5 9.6v4.8l4-2.4z"/></svg><br>还没有录过视频<br>每条录完都会自动存在这里，切走页面、退出浏览器也不会丢</div>';
  }
  let total=0;
  for(const t of all){
    total+=t.size||0;
    const row=document.createElement('div'); row.className='take'; row.setAttribute('role','button');
    const th=document.createElement('div'); th.className='thumb';
    if(t.thumb && t.thumb.startsWith('data:image/')) th.style.backgroundImage=`url("${t.thumb}")`;
    else th.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 7.5v9l7.5-4.5z" fill="currentColor" stroke="none"/></svg>';
    const info=document.createElement('div'); info.className='info';
    const ti=document.createElement('div'); ti.className='t'; ti.textContent=t.title;
    if(t.recovered){ const g=document.createElement('span'); g.className='tag'; g.textContent='找回'; ti.appendChild(g) }
    const m=document.createElement('div'); m.className='m';
    m.textContent=[fmtDate(t.at), t.dur?fmtDur(t.dur):'', ((t.size||0)/1048576).toFixed(1)+' MB', t.cpm?t.cpm+' 字/分':''].filter(Boolean).join(' · ');
    info.append(ti,m);
    const del=mkBtn('删除',async ev=>{
      ev.stopPropagation();
      if(del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='确认'; del.classList.add('armed'); setTimeout(()=>{ del.dataset.arm=''; del.textContent='删除'; del.classList.remove('armed') },2500); return }
      try{ await DB.del('takes',t.id) }catch(e){}
      renderLib(); refreshLibCount();
    },'del');
    row.onclick=()=>openReview(t,'lib');
    row.append(th,info,del); box.appendChild(row);
  }
  $('libSize').textContent=all.length?`${all.length} 条 · ${(total/1048576).toFixed(0)} MB`:'';
}
$('libBtn').onclick=()=>{ $('edit').hidden=true; $('lib').hidden=false; renderLib() };
$('libBack').onclick=()=>{ $('lib').hidden=true; $('edit').hidden=false };

/* ---------- 导入 txt 稿子 ---------- */
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const files=[...e.target.files]; let n=0;
  for(const f of files){
    try{
      const text=(await f.text()).replace(/\r\n?/g,'\n').trim();
      if(!text) continue;
      const s={id:'s'+Date.now()+'_'+n, title:f.name.replace(/\.[^.]+$/,'').slice(0,40), text};
      scripts.unshift(s); cur=s.id; n++;
    }catch(err){}
  }
  e.target.value='';
  if(n){ save(); loadEditor(); toast(`导入了 ${n} 篇`) } else toast('没有读到文字');
};
$('hintBtn').addEventListener('pointerdown',e=>e.preventDefault());   // 不让输入框失去选区
$('hintBtn').onclick=()=>{
  const t=$('text'), a=t.selectionStart, b=t.selectionEnd;
  if(a===b) return toast('先选中要强调的词，再点这里；拍摄时会显示成黄色');
  t.setRangeText('【'+t.value.slice(a,b)+'】',a,b,'end');
  t.dispatchEvent(new Event('input')); t.focus();
};

/* ---------- 离线也能打开 ---------- */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

loadEditor(); applySettings(); recover();
</script>
